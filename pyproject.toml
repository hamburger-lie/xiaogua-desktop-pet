[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xiaogua-desktop-pet"
version = "1.0.0"
description = "每日一瓜 · 小瓜桌宠：会看黄历、会起卦、会记事、到点会叫你的桌面小西瓜"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC-BY-NC-4.0" }
dependencies = ["anthropic>=0.40", "PySide6>=6.6", "pynput>=1.7", "Pillow>=10", "lunar_python>=1.4.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
xiaogua = "meihua.companion.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meihua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
